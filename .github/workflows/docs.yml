name: docs

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      # menpo3d renders offscreen with moderngl, which needs an OpenGL/EGL driver
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri
      - run: pip install -r docs/requirements.txt
      - run: python -m ipykernel install --user --name python3
      # Every code cell on every page is executed (nb_execution_mode=force);
      # a failing sample fails the build. Warnings are errors (-W).
      - name: Build
        env:
          MPLBACKEND: Agg
        run: sphinx-build -b html -W --keep-going -D nb_execution_mode=force docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
